name: PortalsOS
options:
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.portalsos.app
    PRODUCT_NAME: PortalOS
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  PortalsOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: PortalOS
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: PortalOS Camera uses the camera so Insight can describe what you capture.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: PortalOS can use a library photo when the Simulator has no camera.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: PortalOS uses your location for Weather forecasts and Maps routes. You can type a city or place instead.
        INFOPLIST_KEY_NEBIUS_API_KEY: $(NEBIUS_API_KEY)
        INFOPLIST_KEY_GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
    configFiles:
      Debug: Config/PortalsOS.xcconfig
      Release: Config/PortalsOS.xcconfig
    scheme:
      testTargets: []
